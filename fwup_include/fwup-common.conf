#
# Firmware metadata
#

# All of these can be overriden using environment variables of the same name.
#
#  Run 'fwup -m' to query values in a .fw file.
#  Use 'fw_printenv' to query values on the target.
#
# These are used by Nerves libraries to introspect.
define(NERVES_FW_PRODUCT, "Nerves Firmware")
define(NERVES_FW_DESCRIPTION, "")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define(NERVES_FW_PLATFORM, "arduino_uno_q")
define(NERVES_FW_ARCHITECTURE, "aarch64")
define(NERVES_FW_AUTHOR, "The Nerves Team")

define(NERVES_FW_DEVPATH, "/dev/mmcblk0")
define(NERVES_FW_APPLICATION_PART0_DEVPATH, "/dev/mmcblk0p71") # Linux part number is 1-based
define(NERVES_FW_APPLICATION_PART0_FSTYPE, "f2fs")
define(NERVES_FW_APPLICATION_PART0_TARGET, "/root")
define(NERVES_PROVISIONING, "${NERVES_SYSTEM}/images/fwup_include/provisioning.conf")

# Default paths if not specified via the commandline
define(ROOTFS, "${NERVES_SYSTEM}/images/rootfs.squashfs")

# The eMMC keeps Qualcomm's GPT. Partitions 1-66 hold the Qualcomm boot chain
# and are never written by fwup. U-Boot lives in an Android boot image in
# boot_a/boot_b (p11/p12), which ABL loads. Nerves owns the tail of the GPT:
#
# +--------------------------------+
# | GPT, then unused space         |
# +--------------------------------+
# | U-Boot environment (4 MiB)     |
# +--------------------------------+
# | p1-p66: Qualcomm boot chain    |
# |   p11/p12: boot_a/boot_b       |
# +--------------------------------+
# | p67: Boot A (FAT)              |
# +--------------------------------+
# | p68: Boot B (FAT)              |
# +--------------------------------+
# | p69: Rootfs A (squashfs)       |
# +--------------------------------+
# | p70: Rootfs B (squashfs)       |
# +--------------------------------+
# | p71: Application (f2fs)        |
# +--------------------------------+
#
# fwup can't write a GPT with this many entries, so the Nerves partitions are
# created when the board is provisioned. These offsets must match that table.

# Qualcomm's boot_a and boot_b partitions, which hold the U-Boot boot image
define(ABL_BOOT_A_PART_OFFSET, 166400)
define(ABL_BOOT_B_PART_OFFSET, 174592)
define(ABL_BOOT_PART_COUNT, 8192)

# The U-Boot environment is written directly to the eMMC. It is not in any
# partition and must match CONFIG_ENV_OFFSET and CONFIG_ENV_SIZE.
define(UBOOT_ENV_OFFSET, 8192)
define(UBOOT_ENV_COUNT, 256)  # 128 KiB

define(BOOT_A_PART_OFFSET, 987136)
define(BOOT_A_PART_COUNT, 262144)
define-eval(BOOT_B_PART_OFFSET, "${BOOT_A_PART_OFFSET} + ${BOOT_A_PART_COUNT}")
define(BOOT_B_PART_COUNT, ${BOOT_A_PART_COUNT})

define-eval(ROOTFS_A_PART_OFFSET, "${BOOT_B_PART_OFFSET} + ${BOOT_B_PART_COUNT}")
define(ROOTFS_A_PART_COUNT, 1048576)
define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT}")
define(ROOTFS_B_PART_COUNT, ${ROOTFS_A_PART_COUNT})

# Application partition. It occupies the rest of the eMMC; the count here only
# bounds what factory-reset trims.
define-eval(APP_PART_OFFSET, "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT}")
define(APP_PART_COUNT, 1048576)

# Firmware archive metadata
meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}
