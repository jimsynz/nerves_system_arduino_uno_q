version = 1

[[annotations]]
path = [
 ".formatter.exs",
 ".gitignore",
 "CHANGELOG.md",
 "nerves_defconfig",
 "REUSE.toml",
 "mix.exs",
 "mix.lock",
 "renovate.json",
 "VERSION"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "None"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = [
 "README.md"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 James Harton"
SPDX-License-Identifier = "CC-BY-4.0"

# Buildroot derived or related files
[[annotations]]
path = [
 "Config.in",
 "package/**",
 "external.mk",
 "post-build.sh",
 "post-createfs.sh"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "The Buildroot developers <buildroot@buildroot.org>"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Linux kernel derived or related files
[[annotations]]
path = [
 "linux/*"
]
precedence = "override"
SPDX-FileCopyrightText = "Various"
SPDX-License-Identifier = "GPL-2.0-only"

# U-Boot derived or related files
[[annotations]]
path = [
 "uboot/*"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2000-2013 Wolfgang Denk, DENX Software Engineering, wd@denx.de"
SPDX-License-Identifier = "GPL-2.0-or-later"

# Fwup and other config files
[[annotations]]
path = [
 "busybox.fragment",
 "fwup-ops.conf",
 "fwup.conf",
 "fwup_include/*",
 "rootfs_overlay/etc/boardid.config",
 "rootfs_overlay/etc/erlinit.config",
 "rootfs_overlay/etc/fw_env.config"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "None"
SPDX-License-Identifier = "CC0-1.0"

# UNO Q MCU tooling
[[annotations]]
path = [
 "package/uno-q-mcu/make_nerves_anim.py",
 "package/uno-q-mcu/unoq-mcu",
 "package/uno-q-openocd/arduino_uno_q.cfg",
 "rootfs_overlay/usr/sbin/uno-q-init"
]
precedence = "override"
SPDX-FileCopyrightText = "2026 James Harton"
SPDX-License-Identifier = "Apache-2.0"

# Elixir code
[[annotations]]
path = [
 "lib/**",
 "test/**"
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 James Harton"
SPDX-License-Identifier = "Apache-2.0"
