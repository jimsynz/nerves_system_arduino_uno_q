# Arduino UNO Q: the STM32U585 MCU's SWD port, bit-banged from the QRB2210's
# TLMM GPIOs (gpiochip1). Pin mapping from Arduino's meta-arduino
# openocd_gpiod.cfg.

adapter driver linuxgpiod
adapter gpio srst 38 -chip 1
adapter gpio swclk 26 -chip 1
adapter gpio swdio 25 -chip 1
transport select swd

source [find target/stm32u5x.cfg]

# The upstream STM32U5 reset-start handler sets an adapter speed, which the
# linuxgpiod bit-bang adapter doesn't support.
stm32u5x.cpu configure -event reset-start {}
